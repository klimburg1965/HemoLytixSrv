<!DOCTYPE html>
<html lang="de" class="h-full bg-slate-100 text-slate-900">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HemoLytix Dashboard</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body class="h-full flex flex-col font-sans selection:bg-blue-500 selection:text-white">

<!-- Top Navigation -->
<header class="border-b border-slate-200 bg-white/80 backdrop-blur-md sticky top-0 z-50 shadow-xs">
    <div class="max-w-7xl mx-auto px-4 h-16 flex justify-between items-center">
        <div class="flex items-center space-x-3">
            <div class="w-8 h-8 rounded-lg bg-blue-600 flex items-center justify-center font-bold text-white shadow-xs">H</div>
            <h1 class="font-semibold text-lg tracking-tight text-slate-900">HemoLytix <span class="text-xs text-blue-600 font-normal ml-1">v3.3 Web</span></h1>
        </div>
        <div class="flex items-center space-x-4">
            <a href="/swagger-ui/index.html" target="_blank" class="text-xs text-slate-500 hover:text-slate-800 transition">Swagger API</a>
            <button id="logout-btn" onclick="logout()" class="text-xs bg-white hover:bg-slate-100 text-slate-700 px-3 py-1.5 rounded-lg transition border border-slate-300 shadow-xs">Abmelden</button>
        </div>
    </div>
</header>

<!-- Main Content Area -->
<main class="flex-1 max-w-7xl w-full mx-auto p-4 grid grid-cols-1 md:grid-cols-3 gap-6 overflow-hidden">

    <!-- Left Column: Patient List -->
    <section class="bg-white border border-slate-200 rounded-2xl p-4 flex flex-col h-[calc(100vh-7rem)] shadow-xs">
        <div class="flex justify-between items-center mb-3">
            <h2 class="font-medium text-sm text-slate-700">Patienten</h2>
            <div class="flex items-center space-x-2">
                <button onclick="showPatientCreateForm()" class="text-xs bg-blue-50 hover:bg-blue-100 text-blue-700 border border-blue-200 px-2.5 py-1 rounded-lg transition font-medium cursor-pointer">+ Neuer Patient</button>
                <span id="patient-count" class="text-xs bg-slate-100 text-slate-600 px-2 py-0.5 rounded-full font-medium">0</span>
            </div>
        </div>
        <div id="patient-list" class="flex-1 overflow-y-auto space-y-2 pr-1">
            <p class="text-sm text-slate-400">Lade Patienten...</p>
        </div>
    </section>

    <!-- Right / Middle Column: Details & Chart -->
    <section class="md:col-span-2 flex flex-col overflow-y-auto h-[calc(100vh-7rem)] pr-1">
        <!-- Detailansicht / Patient Details Container -->
        <div id="patient-detail-view" class="bg-white border border-slate-200 rounded-2xl p-6 flex-1 flex flex-col items-center justify-center text-center shadow-xs">
            <p class="text-sm text-slate-400">Wähle links einen Patienten aus, um Details anzuzeigen.</p>
        </div>
    </section>

</main>

<!-- Simple Login Modal -->
<div id="login-modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center hidden">
    <div class="bg-white border border-slate-200 p-6 rounded-2xl w-full max-w-md shadow-xl">
        <h2 class="text-lg font-semibold mb-4 text-slate-900">HemoLytix Anmeldung</h2>
        <form onsubmit="handleLogin(event)" class="space-y-4">
            <div>
                <label class="block text-xs text-slate-600 mb-1">Benutzername</label>
                <input type="text" id="login-username" required value="admin" class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-sm text-slate-900 focus:outline-none focus:border-blue-600">
            </div>
            <div>
                <label class="block text-xs text-slate-600 mb-1">Passwort</label>
                <input type="password" id="login-password" required value="admin123" class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-sm text-slate-900 focus:outline-none focus:border-blue-600">
            </div>
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium text-sm py-2.5 rounded-lg transition mt-2 shadow-xs">Anmelden</button>
        </form>
    </div>
</div>

<!-- JavaScript Client Logic -->
<script>
    let currentSelectedPatientId = null;

    document.addEventListener("DOMContentLoaded", () => {
        const token = localStorage.getItem('jwt_token');
        if (!token) {
            document.getElementById('login-modal').classList.remove('hidden');
        } else {
            loadPatients();
        }
    });

    async function handleLogin(event) {
        event.preventDefault();
        const username = document.getElementById('login-username').value;
        const password = document.getElementById('login-password').value;

        try {
            const response = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });

            if (!response.ok) throw new Error('Anmeldung fehlgeschlagen');

            const data = await response.json();
            localStorage.setItem('jwt_token', data.token);
            document.getElementById('login-modal').classList.add('hidden');
            loadPatients();
        } catch (err) {
            alert(err.message);
        }
    }

    function logout() {
        localStorage.removeItem('jwt_token');
        document.getElementById('login-username').value = '';
        document.getElementById('login-password').value = '';
        document.getElementById('login-modal').classList.remove('hidden');

        document.getElementById('patient-list').innerHTML = '<p class="text-sm text-slate-400 p-2">Bitte anmelden.</p>';
        const detailView = document.getElementById('patient-detail-view');
        detailView.className = "bg-white border border-slate-200 rounded-2xl p-6 flex-1 flex flex-col items-center justify-center text-center shadow-xs";
        detailView.innerHTML = '<p class="text-sm text-slate-400">Wähle links einen Patienten aus, um Details anzuzeigen.</p>';
    }

    async function fetchWithAuth(url, options = {}) {
        const token = localStorage.getItem('jwt_token');
        options.headers = {
            ...options.headers,
            'Authorization': `Bearer ${token}`,
            'Content-Type': 'application/json'
        };
        return fetch(url, options);
    }

    async function loadPatients() {
        const listEl = document.getElementById('patient-list');
        listEl.innerHTML = '<p class="text-sm text-slate-400 p-2">Lade Patienten...</p>';

        try {
            const response = await fetchWithAuth('/api/v1/patients');

            if (!response.ok) {
                const errorText = await response.text();
                throw new Error(`HTTP ${response.status}: ${errorText || response.statusText}`);
            }

            const data = await response.json();
            const patients = Array.isArray(data) ? data : (data.content || []);

            document.getElementById('patient-count').textContent = patients.length;

            if (patients.length === 0) {
                listEl.innerHTML = '<p class="text-sm text-slate-400 p-2">Keine Patienten gefunden.</p>';
                return;
            }

            listEl.innerHTML = patients.map(p => `
                <div onclick="selectPatient(${p.id})" class="bg-slate-50 hover:bg-blue-50/50 transition p-3 rounded-xl border border-slate-200 flex justify-between items-center cursor-pointer shadow-2xs">
                    <div>
                        <p class="font-medium text-sm text-slate-800">${p.firstName} ${p.lastName}</p>
                        <p class="text-xs text-slate-400">Geb: ${p.birthDate || 'N/A'}</p>
                    </div>
                    <span class="text-xs bg-white border border-slate-200 text-slate-600 px-2 py-1 rounded font-medium">ID: ${p.id}</span>
                </div>
            `).join('');

        } catch (err) {
            console.error("Fehler beim Laden der Patienten:", err);
            listEl.innerHTML = `<p class="text-sm text-red-500 p-2 bg-red-50 rounded border border-red-200"><strong>Ladefehler:</strong> ${err.message}</p>`;
        }
    }

    let bloodChart = null;

    async function selectPatient(patientId) {
        currentSelectedPatientId = patientId;
        const detailContainer = document.getElementById('patient-detail-view');
        detailContainer.className = "bg-white border border-slate-200 rounded-2xl p-6 flex-1 flex flex-col text-left overflow-y-auto shadow-xs";
        detailContainer.innerHTML = '<p class="text-sm text-slate-400 text-center py-6">Lade Patientendetails und Blutwerte...</p>';

        try {
            const patientResponse = await fetchWithAuth(`/api/v1/patients/${patientId}`);
            if (!patientResponse.ok) throw new Error('Fehler beim Laden der Patientendetails');
            const p = await patientResponse.json();

            const bloodResponse = await fetchWithAuth(`/api/v1/patients/${patientId}/complete-blood-counts`);
            const bloodData = bloodResponse.ok ? await bloodResponse.json() : [];

            const addressText = p.address
                ? `${p.address.street || ''} ${p.address.houseNumber || ''}, ${p.address.zipCode || ''} ${p.address.city || ''}`
                : 'Keine Adresse hinterlegt';

            detailContainer.innerHTML = `
                <div class="w-full space-y-6">
                    <div class="flex justify-between items-start border-b border-slate-100 pb-3">
                        <div>
                            <h3 class="text-base font-semibold text-slate-900">${p.firstName} ${p.lastName}</h3>
                            <p class="text-xs text-slate-500 mt-0.5">ID: ${p.id} • Geburtsdatum: ${p.birthDate || 'N/A'} • Geschlecht: ${p.gender || 'N/A'} • Blutgruppe: ${p.bloodType || 'N/A'}</p>
                        </div>
                        <div class="flex items-center space-x-2">
                            <button onclick="showBloodCountForm()" class="text-xs bg-blue-50 hover:bg-blue-100 text-blue-700 border border-blue-200 px-3 py-1.5 rounded-lg transition font-medium flex items-center space-x-1 shadow-xs cursor-pointer">
                                <span>+ Blutbild erfassen</span>
                            </button>
                            <button onclick="downloadPdfReport(${p.id}, '${p.firstName}_${p.lastName}')" class="text-xs bg-emerald-50 hover:bg-emerald-100 text-emerald-700 border border-emerald-200 px-3 py-1.5 rounded-lg transition font-medium flex items-center space-x-1 shadow-xs cursor-pointer">
                                <span>PDF-Bericht</span>
                            </button>
                            <span class="text-xs bg-blue-50 text-blue-700 px-2.5 py-1 rounded-full border border-blue-200 font-medium">Aktiv</span>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div class="bg-slate-50 p-4 rounded-xl border border-slate-200 space-y-2">
                            <h4 class="text-xs font-medium text-slate-500 uppercase tracking-wider mb-2">Stammdaten & Adresse</h4>
                            <p class="text-sm text-slate-700"><strong>Adresse:</strong> ${addressText}</p>
                            <p class="text-sm text-slate-700"><strong>Hausarzt:</strong> ${p.familyDoctor || 'Nicht hinterlegt'}</p>
                            <p class="text-sm text-slate-700"><strong>Krankenkasse:</strong> ${p.healthInsuranceCompany || 'Nicht hinterlegt'}</p>
                        </div>
                        <div class="bg-slate-50 p-4 rounded-xl border border-slate-200">
                            <h4 class="text-xs font-medium text-slate-500 uppercase tracking-wider mb-2">Statistik</h4>
                            <p class="text-sm text-slate-600">Analysen gesamt: <span class="text-slate-900 font-semibold">${bloodData.length || 0}</span></p>
                        </div>
                    </div>

                    <!-- Diagramm Container -->
                    <div class="bg-slate-50 p-4 rounded-xl border border-slate-200 mt-4">
                        <h4 class="text-xs font-medium text-slate-500 uppercase tracking-wider mb-3">Laborwerte-Verlauf</h4>
                        <div class="h-64 w-full relative">
                            <canvas id="bloodValueChart"></canvas>
                        </div>
                    </div>

                    <!-- Patientendaten Update Formular -->
                    <div class="bg-slate-50 border border-slate-200 rounded-xl p-5 mt-6">
                        <h4 class="font-medium text-xs text-slate-700 uppercase tracking-wider mb-4">Patientendaten</h4>
                        <form id="patient-form" onsubmit="handleUpdatePatient(event)" class="space-y-4">
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-xs text-slate-500 mb-1">Vorname</label>
                                    <input type="text" id="firstName" required class="w-full bg-white border border-slate-300 rounded-lg px-3 py-2 text-sm text-slate-900 focus:outline-none focus:border-blue-600">
                                </div>
                                <div>
                                    <label class="block text-xs text-slate-500 mb-1">Nachname</label>
                                    <input type="text" id="lastName" required class="w-full bg-white border border-slate-300 rounded-lg px-3 py-2 text-sm text-slate-900 focus:outline-none focus:border-blue-600">
                                </div>
                                <div>
                                    <label class="block text-xs text-slate-500 mb-1">Geburtsdatum (JJJJ-MM-TT)</label>
                                    <input type="text" id="birthDate" placeholder="1980-05-14" pattern="\\d{4}-\\d{2}-\\d{2}" required class="w-full bg-white border border-slate-300 rounded-lg px-3 py-2 text-sm text-slate-900 focus:outline-none focus:border-blue-600">
                                </div>
                                <div>
                                    <label class="block text-xs text-slate-500 mb-1">Geschlecht (Gender)</label>
                                    <select id="gender" class="w-full bg-white border border-slate-300 rounded-lg px-3 py-2 text-sm text-slate-900 focus:outline-none focus:border-blue-600">
                                        <option value="MALE">Männlich</option>
                                        <option value="FEMALE">Weiblich</option>
                                        <option value="UNSPECIFIED">Unspezifiziert</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="block text-xs text-slate-500 mb-1">Blutgruppe (BloodType)</label>
                                    <select id="bloodType" class="w-full bg-white border border-slate-300 rounded-lg px-3 py-2 text-sm text-slate-900 focus:outline-none focus:border-blue-600">
                                        <option value="">Keine Angabe</option>
                                        <option value="A+">A+</option>
                                        <option value="A-">A-</option>
                                        <option value="B+">B+</option>
                                        <option value="B-">B-</option>
                                        <option value="AB+">AB+</option>
                                        <option value="AB-">AB-</option>
                                        <option value="0+">0+</option>
                                        <option value="0-">0-</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="block text-xs text-slate-500 mb-1">Hausarzt</label>
                                    <input type="text" id="familyDoctor" placeholder="Dr. med. Mustermann" class="w-full bg-white border border-slate-300 rounded-lg px-3 py-2 text-sm text-slate-900 focus:outline-none focus:border-blue-600">
                                </div>
                                <div class="sm:col-span-2">
                                    <label class="block text-xs text-slate-500 mb-1">Krankenkasse</label>
                                    <input type="text" id="healthInsuranceCompany" placeholder="AOK, TK, Barmer..." class="w-full bg-white border border-slate-300 rounded-lg px-3 py-2 text-sm text-slate-900 focus:outline-none focus:border-blue-600">
                                </div>
                            </div>

                            <div class="border-t border-slate-200 pt-4 mt-4">
                                <h5 class="font-medium text-xs text-slate-600 uppercase tracking-wider mb-3">Adresse</h5>
                                <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                                    <div class="sm:col-span-2">
                                        <label class="block text-xs text-slate-500 mb-1">Straße</label>
                                        <input type="text" id="street" class="w-full bg-white border border-slate-300 rounded-lg px-3 py-2 text-sm text-slate-900 focus:outline-none focus:border-blue-600">
                                    </div>
                                    <div>
                                        <label class="block text-xs text-slate-500 mb-1">Hausnummer</label>
                                        <input type="text" id="houseNumber" class="w-full bg-white border border-slate-300 rounded-lg px-3 py-2 text-sm text-slate-900 focus:outline-none focus:border-blue-600">
                                    </div>
                                    <div>
                                        <label class="block text-xs text-slate-500 mb-1">PLZ</label>
                                        <input type="text" id="zipCode" class="w-full bg-white border border-slate-300 rounded-lg px-3 py-2 text-sm text-slate-900 focus:outline-none focus:border-blue-600">
                                    </div>
                                    <div class="sm:col-span-2">
                                        <label class="block text-xs text-slate-500 mb-1">Stadt</label>
                                        <input type="text" id="city" class="w-full bg-white border border-slate-300 rounded-lg px-3 py-2 text-sm text-slate-900 focus:outline-none focus:border-blue-600">
                                    </div>
                                </div>
                            </div>

                            <div class="flex justify-end mt-4">
                                <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-medium text-xs px-4 py-2 rounded-lg transition shadow-xs cursor-pointer">Änderungen speichern</button>
                            </div>
                        </form>
                    </div>
                </div>
            `;

            // Felder befüllen
            document.getElementById('firstName').value = p.firstName || '';
            document.getElementById('lastName').value = p.lastName || '';
            document.getElementById('birthDate').value = p.birthDate || '';
            document.getElementById('gender').value = p.gender || 'MALE';
            document.getElementById('bloodType').value = p.bloodType || '';
            document.getElementById('familyDoctor').value = p.familyDoctor || '';
            document.getElementById('healthInsuranceCompany').value = p.healthInsuranceCompany || '';
            if (p.address) {
                document.getElementById('street').value = p.address.street || '';
                document.getElementById('houseNumber').value = p.address.houseNumber || '';
                document.getElementById('zipCode').value = p.address.zipCode || '';
                document.getElementById('city').value = p.address.city || '';
            }

            renderBloodChart(bloodData);

        } catch (err) {
            console.error(err);
            detailContainer.innerHTML = `<p class="text-sm text-red-500 text-center py-6">Fehler beim Laden der Details.</p>`;
        }
    }

    // Ansicht für neuen Patienten anlegen

        detailContainer.className = "bg-white border border-slate-200 rounded-2xl p-6 flex-1 flex flex-col text-left overflow-y-auto shadow-xs";

        detailContainer.innerHTML = `
            <div class="w-full space-y-6">

                    </div>
                </div>

                <div class="bg-slate-50 border border-slate-200 rounded-xl p-5">
                    <form id="patient-create-form" onsubmit="handleCreatePatient(event)" class="space-y-4">

                                <input type="text" id="create-firstName" required class="w-full bg-white border border-slate-300 rounded-lg px-3 py-2 text-sm text-slate-900 focus:outline-none focus:border-blue-600">
                            </div>
                            <div>
                                <label class="block text-xs text-slate-500 mb-1">Nachname</label>
                                <input type="text" id="create-lastName" required class="w-full bg-white border border-slate-300 rounded-lg px-3 py-2 text-sm text-slate-900 focus:outline-none focus:border-blue-600">

                            </div>
                            <div>

                                    <option value="">Keine Angabe</option>
                                    <option value="A+">A+</option>
                                    <option value="A-">A-</option>
                                    <option value="B+">B+</option>

                                    <option value="AB-">AB-</option>
                                    <option value="0+">0+</option>
                                    <option value="0-">0-</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs text-slate-500 mb-1">Hausarzt</label>
                                <input type="text" id="create-familyDoctor" placeholder="Dr. med. Mustermann" class="w-full bg-white border border-slate-300 rounded-lg px-3 py-2 text-sm text-slate-900 focus:outline-none focus:border-blue-600">
                            </div>
                            <div class="sm:col-span-2">
                                <label class="block text-xs text-slate-500 mb-1">Krankenkasse</label>
                                <input type="text" id="create-healthInsuranceCompany" placeholder="AOK, TK, Barmer..." class="w-full bg-white border border-slate-300 rounded-lg px-3 py-2 text-sm text-slate-900 focus:outline-none focus:border-blue-600">
                            </div>
                        </div>

                        <div class="border-t border-slate-200 pt-4 mt-4">

    async function showBloodCountForm() {
        if (!currentSelectedPatientId) return;

        const detailContainer = document.getElementById('patient-detail-view');

        try {
            const patientResponse = await fetchWithAuth(`/api/v1/patients/${currentSelectedPatientId}`);
            const p = await patientResponse.json();

    async function handleCreateBloodCount(event) {
        event.preventDefault();
        if (!currentSelectedPatientId) return;

        const getNum = (id) => {
            const val = document.getElementById(id).value;
            return val ? parseFloat(val) : null;
        };

        const payload = {
            recordedAt: document.getElementById('recordedAt').value ? document.getElementById('recordedAt').value + ':00' : null,
            hemoglobin: getNum('hemoglobin'),
            erythrocytes: getNum('erythrocytes'),
            hematocrit: getNum('hematocrit'),
            mcv: getNum('mcv'),
            mch: getNum('mch'),
            mchc: getNum('mchc'),
            leukocytes: getNum('leukocytes'),
            platelets: getNum('platelets'),
            neutrophilsRel: getNum('neutrophilsRel'),
            lymphocytesRel: getNum('lymphocytesRel'),
            monocytesRel: getNum('monocytesRel'),
            eosinophilsRel: getNum('eosinophilsRel'),
            basophilsRel: getNum('basophilsRel'),
            notes: document.getElementById('notes').value || null
        };

        try {
            const response = await fetchWithAuth(`/api/v1/patients/${currentSelectedPatientId}/complete-blood-counts`, {
                method: 'POST',
                body: JSON.stringify(payload)
            });

            if (!response.ok) {
                const errText = await response.text();
                throw new Error(errText || 'Fehler beim Speichern des Blutbildes');
            }

            alert('Blutbild erfolgreich gespeichert und analysiert!');
            selectPatient(currentSelectedPatientId);
        } catch (err) {
            alert('Speichern fehlgeschlagen: ' + err.message);
        }
    }

    async function handleUpdatePatient(event) {
        event.preventDefault();
        if (!currentSelectedPatientId) return;

        const payload = {
            firstName: document.getElementById('firstName').value,
            lastName: document.getElementById('lastName').value,
            birthDate: document.getElementById('birthDate').value,
            gender: document.getElementById('gender').value,
            bloodType: document.getElementById('bloodType').value || null,
            familyDoctor: document.getElementById('familyDoctor').value || null,
            healthInsuranceCompany: document.getElementById('healthInsuranceCompany').value || null,
            address: {
                street: document.getElementById('street').value,
                houseNumber: document.getElementById('houseNumber').value,
                zipCode: document.getElementById('zipCode').value,
                city: document.getElementById('city').value
            }
        };

        try {
            const response = await fetchWithAuth(`/api/v1/patients/${currentSelectedPatientId}`, {
                method: 'PUT',
                body: JSON.stringify(payload)
            });

            if (!response.ok) throw new Error('Fehler beim Aktualisieren');

            alert('Patientendaten erfolgreich aktualisiert!');
            loadPatients();
            selectPatient(currentSelectedPatientId);
        } catch (err) {
            alert(err.message);
        }
    }

    async function handleCreatePatient(event) {
        event.preventDefault();
        const payload = {
            firstName: document.getElementById('create-firstName').value,
            lastName: document.getElementById('create-lastName').value,
            birthDate: document.getElementById('create-birthDate').value,
            gender: document.getElementById('create-gender').value,
            bloodType: document.getElementById('create-bloodType').value || null,
            familyDoctor: document.getElementById('create-familyDoctor').value || null,
            healthInsuranceCompany: document.getElementById('create-healthInsuranceCompany').value || null,
            address: {
                street: document.getElementById('create-street').value,
                houseNumber: document.getElementById('create-houseNumber').value,
                zipCode: document.getElementById('create-zipCode').value,
                city: document.getElementById('create-city').value
            }
        };

        try {
            const response = await fetchWithAuth('/api/v1/patients', {
                method: 'POST',
                body: JSON.stringify(payload)
            });

            if (!response.ok) throw new Error('Fehler beim Speichern');

            alert('Patient erfolgreich angelegt!');
            loadPatients();
            document.getElementById('patient-create-form').reset();
        } catch (err) {
            alert(err.message);
        }
    }

    async function downloadPdfReport(patientId, patientName) {
        try {
            const response = await fetchWithAuth(`/api/v1/patients/${patientId}/report`, {
                method: 'GET'
            });

            if (!response.ok) throw new Error('Fehler beim Generieren des PDF-Berichts');

            const blob = await response.blob();
            const url = window.URL.createObjectURL(blob);
            window.open(url, '_blank');
            setTimeout(() => window.URL.revokeObjectURL(url), 10000);
        } catch (err) {
            console.error(err);
            alert('Konnte PDF nicht öffnen: ' + err.message);
        }
    }

    function renderBloodChart(bloodData) {
        const ctx = document.getElementById('bloodValueChart').getContext('2d');

        if (bloodChart) {
            bloodChart.destroy();
        }

        if (!Array.isArray(bloodData) || bloodData.length === 0) {
            console.warn("Keine Blutbild-Daten vorhanden.");
            return;
        }

        const labels = bloodData.map(b => b.recordedAt ? new Date(b.recordedAt).toLocaleDateString('de-DE') : 'Unbekannt');
        const getVal = (item, field) => (item[field] && typeof item[field].value === 'number') ? item[field].value : null;

        bloodChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [
                    {
                        label: 'Hämoglobin (g/dL)',
                        data: bloodData.map(b => getVal(b, 'hemoglobin')),
                        borderColor: '#2563eb',
                        backgroundColor: 'rgba(37, 99, 235, 0.05)',
                        borderWidth: 2,
                        tension: 0.3,
                        pointRadius: 4
                    },
                    {
                        label: 'Erythrozyten (M/µL)',
                        data: bloodData.map(b => getVal(b, 'erythrocytes')),
                        borderColor: '#0ea5e9',
                        backgroundColor: 'transparent',
                        borderWidth: 2,
                        tension: 0.3,
                        pointRadius: 3
                    },
                    {
                        label: 'Leukozyten (K/µL)',
                        data: bloodData.map(b => getVal(b, 'leukocytes')),
                        borderColor: '#10b981',
                        backgroundColor: 'transparent',
                        borderWidth: 2,
                        tension: 0.3,
                        pointRadius: 3
                    },
                    {
                        label: 'Hämatokrit (%)',
                        data: bloodData.map(b => b.hematocrit ? b.hematocrit.value : null),
                        borderColor: '#f59e0b',
                        backgroundColor: 'transparent',
                        borderWidth: 2,
                        tension: 0.3,
                        pointRadius: 3
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        display: true,
                        position: 'top',
                        labels: { color: '#334155', font: { size: 11 }, boxWidth: 12 }
                    }
                },
                scales: {
                    x: {
                        grid: { color: 'rgba(226, 232, 240, 0.8)' },
                        ticks: { color: '#64748b', font: { size: 11 } }
                    },
                    y: {
                        grid: { color: 'rgba(226, 232, 240, 0.8)' },
                        ticks: { color: '#64748b', font: { size: 11 } }
                    }
                }
            }
        });
    }
