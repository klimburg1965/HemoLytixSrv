# Server Port (optional, Standard ist 8080)
server.port=8080

# Dateibasierte H2-Datenbank (Daten bleiben erhalten!)
spring.datasource.url=jdbc:h2:file:./data/hemolytixdb;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console im Browser aktivieren (unter http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate Konfiguration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true